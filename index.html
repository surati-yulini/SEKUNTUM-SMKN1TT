        background-attachment: fixed;

        @media print {

</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Data Awal Contoh Permohonan untuk Simulasi
        const INITIAL_REQUESTS = [
            {
                id: "REQ-2026-001",
                nama: "Budi Santoso",
                tempatLahir: "Tebing Tinggi",
                tanggalLahir: "12 Mei 2005",
                nisn: "0054321890",
                noWa: "081265439871",
                kategori: "Alumni",
                tahunLulus: "2023",
                jurusan: "Teknik Otomotif (TO)",
                jenisLayanan: "Legalisir Ijazah & Transkrip Nilai",
                jumlahLembar: 5,
                keperluan: "Melamar Pekerjaan BUMN",
                tanggal: "2026-09-15 08:30",
                status: "Siap Diambil",
                catatan: "Dokumen sudah dilegalisir dan dicap basah oleh Kepala Sekolah. Silakan bawa dokumen asli saat pengambilan.",
                petugas: "Suratih, S.Pd. (TU)"
            },
            {
                id: "REQ-2026-002",
                nama: "Siti Rahmawati",
                tempatLahir: "Selatpanjang",
                tanggalLahir: "20 Agustus 2006",
                nisn: "0061239874",
                noWa: "085270112233",
                kategori: "Orang Tua/Wali",
                tahunLulus: "2026",
                jurusan: "Teknik Jaringan Komputer dan Telekomunikasi",
                jenisLayanan: "Pengambilan Ijazah Asli",
                jumlahLembar: 1,
                keperluan: "Pendaftaran Kuliah",
                tanggal: "2026-09-16 09:15",
                status: "Diproses",
                catatan: "Sedang diproses verifikasi bebas pustaka dan bebas SPP.",
                petugas: "Suratih, S.Pd. (TU)"
            },
            {
                id: "REQ-2026-003",
                nama: "Rian Hidayat",
                tempatLahir: "Pekanbaru",
                tanggalLahir: "10 Maret 2007",
                nisn: "0078901234",
                noWa: "081398761234",
                kategori: "Siswa Aktif",
                tahunLulus: "-",
                jurusan: "Teknik Jaringan Komputer dan Telekomunikasi",
                jenisLayanan: "Surat Pindah / Mutasi Keluar",
                jumlahLembar: 1,
                keperluan: "Pindah Domisili Orang Tua ke Medan",
                tanggal: "2026-09-16 10:00",
                status: "Pending",
                catatan: "Permohonan baru diterima, menunggu verifikasi berkas kelengkapan.",
                petugas: "Staf Administrasi TU"
            },
            {
                id: "REQ-2026-004",
                nama: "Dewi Kartika",
                tempatLahir: "Tebing Tinggi",
                tanggalLahir: "05 Oktober 2003",
                nisn: "0034567891",
                noWa: "082166554433",
                kategori: "Alumni",
                tahunLulus: "2021",
                jurusan: "Akuntansi & Keuangan Lembaga",
                jenisLayanan: "Surat Keterangan Kehilangan Ijazah (SKPI)",
                jumlahLembar: 2,
                keperluan: "Syarat CPNS",
                tanggal: "2026-09-14 14:20",
                status: "Selesai",
                catatan: "Dokumen telah diserahkan pada tanggal 15 September 2026.",
                petugas: "Suratih, S.Pd. (TU)"
            }
        ];

        function App() {
            const [view, setView] = useState('public');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            
            const [requests, setRequests] = useState(() => {
                const saved = localStorage.getItem('sipatuh_requests');
                return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
            });
            const [trackingId, setTrackingId] = useState('');
            const [trackedItem, setTrackedItem] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('Semua');
            const [selectedDetail, setSelectedDetail] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            useEffect(() => {
                localStorage.setItem('sipatuh_requests', JSON.stringify(requests));
            }, [requests]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            const handleAdminAccess = () => {
                if (isAuthenticated) {
                    setView('admin');
                } else {
                    setShowLoginModal(true);
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                setView('public');
                showToast("Anda telah keluar dari Portal TU.");
            };

            const handleFormSubmit = (formData) => {
                const newId = `REQ-2026-${String(requests.length + 1).padStart(3, '0')}`;
                const newEntry = {
                    id: newId,
                    ...formData,
                    tanggal: new Date().toISOString().replace('T', ' ').substring(0, 16),
                    status: 'Pending',
                    catatan: 'Permohonan berhasil dikirim. Menunggu verifikasi berkas oleh Ibu Suratih / Staf TU.',
                    petugas: 'Administrasi TU SMKN 1'
                };
                setRequests([newEntry, ...requests]);
                setTrackingId(newId);
                setTrackedItem(newEntry);
                setView('tracking');
                showToast(`Permohonan Berhasil Dikirim! Kode Resi Anda: ${newId}`);
            };

            const handleUpdateStatus = (id, newStatus, newCatatan) => {
                const updated = requests.map(req => {
                    if (req.id === id) {
                        return { ...req, status: newStatus, catatan: newCatatan || req.catatan };
                    }
                    return req;
                });
                setRequests(updated);
                if (selectedDetail && selectedDetail.id === id) {
                    setSelectedDetail({ ...selectedDetail, status: newStatus, catatan: newCatatan || selectedDetail.catatan });
                }
                showToast(`Status permohonan ${id} diperbarui menjadi: ${newStatus}`);
            };

            const handleSearchTracking = (e) => {
                e.preventDefault();
                const term = trackingId.trim().toLowerCase();
                const found = requests.find(r => 
                    r.id.toLowerCase() === term ||
                    r.noWa.toLowerCase() === term ||
                    (r.tempatLahir && r.tempatLahir.toLowerCase().includes(term))
                );
                if (found) {
                    setTrackedItem(found);
                } else {
                    setTrackedItem('NOT_FOUND');
                }
            };

            const handleExportCSV = () => {
                if (requests.length === 0) {
                    alert("Tidak ada data untuk diexport.");
                    return;
                }

                const headers = ["ID Permohonan", "Nama Pemohon", "Tempat Lahir", "Tanggal Lahir", "NISN", "No WhatsApp", "Kategori", "Tahun Lulus", "Jurusan", "Jenis Layanan", "Jumlah Lembar", "Keperluan", "Tanggal", "Status", "Catatan Petugas"];
                
                const csvRows = [
                    headers.join(','),
                    ...requests.map(r => [
                        `"${r.id}"`,
                        `"${r.nama}"`,
                        `"${r.tempatLahir || '-'}"`,
                        `"${r.tanggalLahir || '-'}"`,
                        `"${r.nisn || '-'}"`,
                        `"${r.noWa}"`,
                        `"${r.kategori}"`,
                        `"${r.tahunLulus}"`,
                        `"${r.jurusan}"`,
                        `"${r.jenisLayanan}"`,
                        `"${r.jumlahLembar}"`,
                        `"${(r.keperluan || '').replace(/"/g, '""')}"`,
                        `"${r.tanggal}"`,
                        `"${r.status}"`,
                        `"${(r.catatan || '').replace(/"/g, '""')}"`
                    ].join(','))
                ];

                const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Rekapitulasi_SIPATUH_SMKN1_${new Date().toISOString().substring(0, 10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Rekapitulasi CSV berhasil diunduh secara real-time!");
            };

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Notification Toast */}
                    {toastMessage && (
                        <div class="fixed top-5 right-5 z-50 bg-emerald-700 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-emerald-500 animate-bounce">
                            <i data-lucide="check-circle" class="w-5 h-5"></i>
                            <span class="font-medium text-sm">{toastMessage}</span>
                        </div>
                    )}

                    <header class="bg-gradient-to-r from-brand-900 via-brand-800 to-slate-900 text-white shadow-xl no-print sticky top-0 z-40">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div class="flex items-center gap-3 cursor-pointer" onClick={() => setView('public')}>
                                <div class="w-11 h-11 bg-white/10 rounded-xl flex items-center justify-center border border-white/20 backdrop-blur-sm shadow-inner">
                                    <i data-lucide="graduation-cap" class="w-6 h-6 text-sky-300"></i>
                                </div>
                                <div>
                                    <h1 class="font-bold text-lg leading-tight tracking-wide flex items-center gap-2">
                                        SI-PATUH <span class="text-xs bg-sky-500 text-white px-2 py-0.5 rounded-full font-semibold">SMK Negeri 1 Tebing Tinggi</span>
                                    </h1>
                                    <p class="text-xs text-sky-200/80">Sistem Informasi Pelayanan Administrasi Tata Usaha Handal SMK Negeri 1 Tebing Tinggi</p>
                                </div>
                            </div>

                            <nav class="flex items-center bg-white/10 p-1 rounded-xl border border-white/15 text-xs font-medium">
                                <button 
                                    onClick={() => setView('public')}
                                    class={`px-3.5 py-2 rounded-lg transition-all flex items-center gap-2 ${view === 'public' ? 'bg-sky-500 text-white shadow-md' : 'text-slate-200 hover:bg-white/10'}`}>
                                    <i data-lucide="file-plus" class="w-4 h-4"></i>
                                    <span>Ajukan Layanan</span>
                                </button>
                                <button 
                                    onClick={() => setView('tracking')}
                                    class={`px-3.5 py-2 rounded-lg transition-all flex items-center gap-2 ${view === 'tracking' ? 'bg-sky-500 text-white shadow-md' : 'text-slate-200 hover:bg-white/10'}`}>
                                    <i data-lucide="search" class="w-4 h-4"></i>
                                    <span>Lacak Berkas</span>
                                </button>
                                <button 
                                    onClick={handleAdminAccess}
                                    class={`px-3.5 py-2 rounded-lg transition-all flex items-center gap-2 ${view === 'admin' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-200 hover:bg-white/10'}`}>
                                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                                    <span>Portal TU</span>
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {view === 'public' && <PublicPortal onSubmit={handleFormSubmit} onGoTracking={() => setView('tracking')} />}
                        {view === 'tracking' && (
                            <TrackingView 
                                trackingId={trackingId} 
                                setTrackingId={setTrackingId} 
                                onSearch={handleSearchTracking} 
                                trackedItem={trackedItem} 
                            />
                        )}
                        {view === 'admin' && isAuthenticated && (
                            <AdminDashboard 
                                requests={requests} 
                                searchQuery={searchQuery}
                                setSearchQuery={setSearchQuery}
                                statusFilter={statusFilter}
                                setStatusFilter={setStatusFilter}
                                selectedDetail={selectedDetail}
                                setSelectedDetail={setSelectedDetail}
                                onUpdateStatus={handleUpdateStatus}
                                onExport={handleExportCSV}
                                onLogout={handleLogout}
                            />
                        )}
                    </main>

                    {/* Modal Login khusus Ibu Suratih */}
                    {showLoginModal && (
                        <LoginModal 
                            onSuccess={() => {
                                setIsAuthenticated(true);
                                setShowLoginModal(false);
                                setView('admin');
                                showToast("Berhasil masuk sebagai Ibu Suratih.");
                            }}
                            onClose={() => setShowLoginModal(false)}
                        />
                    )}

                    <footer class="bg-slate-900/90 backdrop-blur-md text-slate-400 py-6 text-xs border-t border-slate-800 no-print mt-auto">
                        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-3 text-center md:text-left">
                            <div>
                                <p class="font-semibold text-slate-200">SMK Negeri 1 Tebing Tinggi — Aplikasi dibuat oleh Surati Yulini, S.Pd</p>
                                <p class="text-slate-400 mt-0.5">Jl. Dorak, Selatpanjang Timur, Kecamatan Tebing Tinggi, Kabupaten Kepulauan Meranti, Provinsi Riau, Kode Pos 28753.</p>
                            </div>
                            <div class="flex items-center gap-4 text-slate-400">
                                <span class="inline-flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Kabupaten Kepulauan Meranti</span>
                                <span class="inline-flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> Jam Kerja: 07.30 - 15.00 WIB</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        function LoginModal({ onSuccess, onClose }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (username.trim() === 'surati' && password === '12345') {
                    onSuccess();
                } else {
                    setError('ID Login atau Password salah! Akses ditolak.');
                }
            };

            return (
                <div class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-5 animate-fadeIn">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 bg-emerald-100 text-emerald-700 rounded-lg flex items-center justify-center">
                                    <i data-lucide="lock" class="w-4 h-4"></i>
                                </div>
                                <h3 class="text-base font-bold text-slate-800">Login Portal TU</h3>
                            </div>
                            <button onClick={onClose} class="text-slate-400 hover:text-slate-600 p-1">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>

                        {error && (
                            <div class="bg-red-50 text-red-600 text-xs p-3 rounded-xl border border-red-200 flex items-center gap-2">
                                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                                <span>{error}</span>
                            </div>
                        )}

                        <form onSubmit={handleLogin} class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">ID Login / Username</label>
                                <input 
                                    type="text" 
                                    required 
                                    value={username} 
                                    onChange={(e) => setUsername(e.target.value)} 
                                    placeholder="Masukkan ID Login" 
                                    class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" 
                                />
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                                <input 
                                    type="password" 
                                    required 
                                    value={password} 
                                    onChange={(e) => setPassword(e.target.value)} 
                                    placeholder="Masukkan Password" 
                                    class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" 
                                />
                            </div>
                            <button 
                                type="submit" 
                                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                                <i data-lucide="key" class="w-4 h-4"></i>
                                Masuk Portal TU
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function PublicPortal({ onSubmit, onGoTracking }) {
            const [formData, setFormData] = useState({
                nama: '',
                tempatLahir: '',
                tanggalLahir: '',
                nisn: '',
                noWa: '',
                kategori: 'Alumni',
                tahunLulus: '2025',
                jurusan: 'Teknik Otomotif (TO)',
                jenisLayanan: 'Legalisir Ijazah & Transkrip Nilai',
                jumlahLembar: 5,
                keperluan: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(formData);
            };

            return (
                <div class="space-y-8 animate-fadeIn">
                    {/* Hero Banner dengan Logo Kanan Atas */}
                    <div class="bg-gradient-to-r from-brand-800 to-sky-700 text-white rounded-2xl p-6 sm:p-8 shadow-xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6">
                        <div class="max-w-2xl relative z-10 flex-1">
                            <span class="inline-block bg-sky-400/20 border border-sky-300/30 text-sky-200 text-xs px-3 py-1 rounded-full font-medium mb-3">
                                Layanan Bebas Antre & Transparan
                            </span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
                                Sistem Informasi Pelayanan Administrasi Tata Usaha Handal SMK Negeri 1 Tebing Tinggi
                            </h2>
                            <p class="mt-2 text-sky-100 text-sm leading-relaxed">
                                Permohonan legalisir, pengambilan ijazah, atau surat keterangan kini lebih cepat, mudah, dan dapat dipantau langsung dari HP Anda.
                            </p>
                            <div class="mt-5 flex flex-wrap gap-3">
                                <a href="#form-layanan" class="bg-white text-brand-900 hover:bg-sky-50 font-bold px-4 py-2.5 rounded-xl text-xs transition shadow flex items-center gap-2">
                                    <i data-lucide="file-text" class="w-4 h-4"></i>
                                    Isi Formulir Sekarang
                                </a>
                                <button onClick={onGoTracking} class="bg-brand-900/60 hover:bg-brand-900 text-white border border-white/20 font-medium px-4 py-2.5 rounded-xl text-xs transition flex items-center gap-2">
                                    <i data-lucide="search" class="w-4 h-4"></i>
                                    Cek Status Permohonan
                                </button>
                            </div>
                        </div>
                        {/* Logo SMKN 1 Tebing Tinggi di Banner Kanan Atas */}
                        <div class="relative z-10 shrink-0 bg-white/10 p-3 rounded-2xl backdrop-blur-md border border-white/20 shadow-2xl flex items-center justify-center">
                            <img 
                                src="https://lh3.googleusercontent.com/d/1kK1c7S6bhQ9xAZrd1wpZ8o0o9EiSCrmN" 
                                alt="Logo SMKN 1 Tebing Tinggi" 
                                class="w-32 h-auto object-contain rounded-lg drop-shadow-lg" 
                            />
                        </div>
                    </div>

                    {/* Layout 2 Kolom */}
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Informasi Persyaratan */}
                        <div class="lg:col-span-4 space-y-4">
                            <div class="bg-white/95 backdrop-blur-sm p-5 rounded-2xl shadow-sm border border-slate-200">
                                <h3 class="font-bold text-slate-800 flex items-center gap-2 text-sm">
                                    <i data-lucide="info" class="w-4 h-4 text-sky-600"></i>
                                    Persyaratan Dokumen
                                </h3>
                                <hr class="my-3 border-slate-100" />
                                <ul class="text-xs space-y-3 text-slate-600">
                                    <li class="flex items-start gap-2">
                                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5"></i>
                                        <span><b>Legalisir Ijazah/Transkrip Nilai:</b> Wajib Membawa Ijazah/Transkrip Nilai Asli.</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5"></i>
                                        <span><b>Pengambilan Ijazah/Transkrip Nilai:</b> Wajib membawa Bukti Bebas Perpustakaan & Bukti Penelusuran Tamatan di Ruang HUMAS.</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5"></i>
                                        <span><b>Surat Pindah (Mutasi):</b> Melampirkan Surat Rekomendasi dari Sekolah Tujuan, Rapor Asli, Fotocopy KTP Orang Tua, Meterai 10rb, Pas Photo 3x4 1 Lembar.</span>
                                    </li>    
                                    <li class="flex items-start gap-2">
                                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5"></i>
                                        <span><b>Surat Keterangan Aktif Belajar:</b> Wajib membawa Kartu Pelajar SMK Negeri 1 Tebing Tinggi.</span>
                                    </li>    
                                    <li class="flex items-start gap-2">

                        <form onSubmit={onSearch} class="mt-6 flex flex-col sm:flex-row gap-2 max-w-lg mx-auto">
                            <input

                                onChange={(e) => setTrackingId(e.target.value)}

                                class="flex-grow text-xs p-3.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 shadow-sm"

                            <p class="font-bold text-sm">Data Permohonan Tidak Ditemukan</p>

                        </div>
                    )}

                    {trackedItem && trackedItem !== 'NOT_FOUND' && (
                        <div class="bg-white/95 backdrop-blur-sm p-6 sm:p-8 rounded-2xl shadow-md border border-slate-200 space-y-6">
                            {/* Header status */}
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-4">
                                <div>
                                    <span class="text-xs font-bold text-sky-600 uppercase tracking-wider">{trackedItem.id}</span>
                                    <h3 class="text-lg font-extrabold text-slate-800">{trackedItem.jenisLayanan}</h3>
                                    <p class="text-xs text-slate-500">Pemohon: <b>{trackedItem.nama}</b> ({trackedItem.kategori})</p>

        function AdminDashboard({ requests, searchQuery, setSearchQuery, statusFilter, setStatusFilter, selectedDetail, setSelectedDetail, onUpdateStatus, onExport, onLogout }) {
            const stats = useMemo(() => {
                const total = requests.length;
                const pending = requests.filter(r => r.status === 'Pending').length;
                const diproses = requests.filter(r => r.status === 'Diproses').length;
                const siap = requests.filter(r => r.status === 'Siap Diambil').length;
                const selesai = requests.filter(r => r.status === 'Selesai').length;
                return { total, pending, diproses, siap, selesai };
            }, [requests]);

            const filteredRequests = useMemo(() => {
                return requests.filter(r => {
                    const matchSearch = r.nama.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                        r.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                        r.jenisLayanan.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchStatus = statusFilter === 'Semua' || r.status === statusFilter;
                    return matchSearch && matchStatus;
                });
            }, [requests, searchQuery, statusFilter]);

            return (
                <div class="space-y-6 animate-fadeIn">
                    {/* Admin Header Bar */}
                    <div class="bg-slate-900/95 backdrop-blur-sm text-white rounded-2xl p-6 shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold">
                                    Portal Admin TU
                                </span>
                                <span class="text-xs text-slate-400">Pengelola: <b>Suratih, S.Pd.</b></span>
                            </div>
                            <h2 class="text-2xl font-bold mt-1">Dashboard Layanan TU SMKN 1 Tebing Tinggi</h2>
                        </div>
                        <div class="flex gap-2">
                            <button onClick={onExport} class="bg-emerald-600 hover:bg-emerald-700 text-xs text-white px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium shadow-sm">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                Export Rekapitulasi (CSV)
                            </button>
                            <button onClick={onLogout} class="bg-red-600/80 hover:bg-red-600 text-xs text-white px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium shadow-sm">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                                Keluar
                            </button>
                        </div>
                    </div>

                    {/* Stat Cards */}
                    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
                        <StatCard label="Total Masuk" count={stats.total} color="bg-slate-100/90 text-slate-800 border-slate-200" icon="inbox" />
                        <StatCard label="Menunggu (Pending)" count={stats.pending} color="bg-amber-50/90 text-amber-700 border-amber-200" icon="clock" />
                        <StatCard label="Sedang Diproses" count={stats.diproses} color="bg-sky-50/90 text-sky-700 border-sky-200" icon="loader" />
                        <StatCard label="Siap Diambil" count={stats.siap} color="bg-purple-50/90 text-purple-700 border-purple-200" icon="package-check" />
                        <StatCard label="Selesai" count={stats.selesai} color="bg-emerald-50/90 text-emerald-700 border-emerald-200" icon="check-circle" />
                    </div>

                    {/* Filter & Search Controls */}
                    <div class="bg-white/95 backdrop-blur-sm p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between gap-4">
                        <div class="relative flex-grow max-w-md">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                            <input 
                                type="text" 
                                value={searchQuery} 
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Cari pemohon, nomor resi, atau jenis layanan..." 
                                class="w-full text-xs pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500" 
                            />
                        </div>
                        <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0 text-xs">
                            <span class="text-slate-400 font-semibold shrink-0">Filter Status:</span>
                            {['Semua', 'Pending', 'Diproses', 'Siap Diambil', 'Selesai'].map(st => (
                                <button 
                                    key={st}
                                    onClick={() => setStatusFilter(st)}
                                    class={`px-3 py-1.5 rounded-xl transition font-medium shrink-0 ${statusFilter === st ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                    {st}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-600">
                                <thead class="bg-slate-50/90 text-slate-700 uppercase tracking-wider font-bold border-b border-slate-200">
                                    <tr>
                                        <th class="px-4 py-3.5">Kode Resi</th>
                                        <th class="px-4 py-3.5">Nama Pemohon</th>
                                        <th class="px-4 py-3.5">Jenis Layanan</th>
                                        <th class="px-4 py-3.5">Tanggal</th>
                                        <th class="px-4 py-3.5">Status</th>
                                        <th class="px-4 py-3.5 text-center">Aksi (Ibu Suratih)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    {filteredRequests.length === 0 ? (
                                        <tr>
                                            <td colSpan="6" class="px-4 py-8 text-center text-slate-400">Tidak ada data permohonan yang sesuai.</td>
                                        </tr>
                                    ) : (
                                        filteredRequests.map((req) => (
                                            <tr key={req.id} class="hover:bg-slate-50/50 transition">
                                                <td class="px-4 py-3.5 font-bold text-sky-700">{req.id}</td>
                                                <td class="px-4 py-3.5">
                                                    <p class="font-bold text-slate-800">{req.nama}</p>
                                                    <p class="text-[11px] text-slate-400">{req.kategori} • WA: {req.noWa}</p>
                                                </td>
                                                <td class="px-4 py-3.5 font-medium text-slate-800">{req.jenisLayanan}</td>
                                                <td class="px-4 py-3.5 text-slate-400">{req.tanggal}</td>
                                                <td class="px-4 py-3.5"><StatusBadge status={req.status} /></td>
                                                <td class="px-4 py-3.5 text-center">
                                                    <button 
                                                        onClick={() => setSelectedDetail(req)}
                                                        class="bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 px-3 py-1.5 rounded-lg font-bold transition">
                                                        Kelola Berkas
                                                    </button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Modal Detail & Update Status */}
                    {selectedDetail && (
                        <AdminModal 
                            item={selectedDetail} 
                            onClose={() => setSelectedDetail(null)} 
                            onUpdateStatus={onUpdateStatus}
                        />
                    )}
                </div>
            );
        }

        function StatCard({ label, count, color, icon }) {
            return (
                <div class={`p-4 rounded-2xl border ${color} backdrop-blur-sm shadow-sm flex items-center justify-between`}>
                    <div>
                        <p class="text-[11px] font-bold uppercase tracking-wider opacity-70">{label}</p>
                        <h3 class="text-2xl font-black mt-0.5">{count}</h3>
                    </div>
                    <div class="p-2.5 bg-white/50 rounded-xl">
                        <i data-lucide={icon} class="w-5 h-5 opacity-80"></i>
                    </div>
                </div>
            );

        function StatusBadge({ status }) {
            let style = "bg-slate-100 text-slate-700 border-slate-200";
            if (status === 'Pending') style = "bg-amber-100 text-amber-800 border-amber-300";
            if (status === 'Diproses') style = "bg-sky-100 text-sky-800 border-sky-300";
            if (status === 'Siap Diambil') style = "bg-purple-100 text-purple-800 border-purple-300";
            if (status === 'Selesai') style = "bg-emerald-100 text-emerald-800 border-emerald-300";

            return (
                <span class={`inline-block px-2.5 py-1 rounded-full text-[11px] font-extrabold border ${style}`}>
                    {status}
                </span>
            );
        }

        function AdminModal({ item, onClose, onUpdateStatus }) {
            const [status, setStatus] = useState(item.status);
            const [catatan, setCatatan] = useState(item.catatan || '');

            const handleSave = () => {
                onUpdateStatus(item.id, status, catatan);
                onClose();
            };

            const sendWhatsApp = () => {
                const text = `Halo Sdr/i ${item.nama}, menginformasikan permohonan layanan ${item.jenisLayanan} (${item.id}) di SMKN 1 Tebing Tinggi saat ini berstatus: *${status}*. Catatan Petugas TU: ${catatan}`;
                const url = `https://wa.me/${item.noWa.replace(/^0/, '62')}?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            };

            return (
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 space-y-5 animate-fadeIn">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div>
                                <span class="text-xs font-bold text-sky-600">{item.id}</span>
                                <h3 class="text-lg font-bold text-slate-800">Kelola Permohonan Berkas</h3>
                            </div>
                            <button onClick={onClose} class="text-slate-400 hover:text-slate-600 p-1">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>

                        <div class="space-y-3 text-xs text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <div class="grid grid-cols-2 gap-2">
                                <p><b>Pemohon:</b> {item.nama}</p>
                                <p><b>No WhatsApp:</b> {item.noWa}</p>
                                <p><b>TTL:</b> {item.tempatLahir}, {item.tanggalLahir}</p>
                                <p><b>Kategori:</b> {item.kategori}</p>
                                <p><b>Jurusan/Tahun:</b> {item.jurusan} ({item.tahunLulus})</p>
                                <p><b>Jumlah:</b> {item.jumlahLembar} Lembar</p>
                            </div>
                            <hr class="border-slate-200 my-1" />
                            <p><b>Keperluan:</b> {item.keperluan}</p>
                        </div>

                        {/* Update Status Options */}
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Ubah Status Permohonan</label>
                                <select value={status} onChange={(e) => setStatus(e.target.value)} class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 font-semibold">
                                    <option value="Pending">Pending (Verifikasi Berkas)</option>
                                    <option value="Diproses">Diproses (Pengerjaan TU)</option>
                                    <option value="Siap Diambil">Siap Diambil di Ruang TU</option>
                                    <option value="Selesai">Selesai (Sudah Diserahkan)</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Catatan / Instruksi Ibu Suratih untuk Pemohon</label>
                                <textarea value={catatan} onChange={(e) => setCatatan(e.target.value)} rows="3" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="Tuliskan catatan tambahan (misal: Bawa fotokopi dokumen pendukung saat pengambilan)..."></textarea>
                            </div>
                        </div>

                        {/* Actions */}
                        <div class="flex flex-col sm:flex-row gap-2 pt-2">
                            <button onClick={sendWhatsApp} class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-1.5 flex-grow">
                                <i data-lucide="message-circle" class="w-4 h-4"></i>
                                Kirim Info via WhatsApp
                            </button>
                            <button onClick={handleSave} class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-1.5 flex-grow">
                                <i data-lucide="save" class="w-4 h-4"></i>
                                Simpan Perubahan
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
